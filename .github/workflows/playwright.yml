name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly full regression run, independent of any push/PR activity.
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast merge gate: runs the small @smoke subset on every push and PR to
  # main. Does not run on the nightly schedule - that's regression's job.
  smoke:
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # No .nvmrc / engines field in package.json; matches the local dev Node version (v20.19.0)
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Flake report
        if: always()
        run: node scripts/flake-report.js --report results.json

      # Gated on job failure() specifically, not on flake-report's
      # flaky-test detection above - the two scripts key off different
      # result statuses (flaky vs failed/timedOut), so a run can show
      # flakiness in the summary without triggering triage, or vice versa.
      # This is expected, not a bug.
      - name: Failure triage
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "## Failure triage" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            node scripts/triage-agent.js --report results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30

  # Full regression: not a per-PR blocker. Runs only after a merge lands on
  # main (push) and on the nightly schedule, to catch anything smoke's small
  # subset didn't cover before the next release.
  regression:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run full regression suite
        run: npm test

      - name: Flake report
        if: always()
        run: node scripts/flake-report.js --report results.json

      # Gated on job failure() specifically, not on flake-report's
      # flaky-test detection above - the two scripts key off different
      # result statuses (flaky vs failed/timedOut), so a run can show
      # flakiness in the summary without triggering triage, or vice versa.
      # This is expected, not a bug.
      - name: Failure triage
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "## Failure triage" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            node scripts/triage-agent.js --report results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression
          path: playwright-report/
          retention-days: 30
